<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peeky Task - Deck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="edge-right font-handwritten">
  <!-- Desktop Edge Stage: 100% transparent background -->
  <div class="overlay-stage" id="overlayStage">

    <!-- Screen-Edge Tab Rail (Vertical column flush against screen bezel) -->
    <div class="edge-rail rested" id="edgeRail">
      <!-- Tabs populated dynamically -->
      <div class="rail-tabs-track" id="railTabsTrack"></div>

      <!-- 3 Rail Action Buttons (Hidden when rested, visible when touched/hovered) -->
      <div class="rail-actions-container" id="railActionsContainer">
        <!-- Add New Task Button (white circular + button) -->
        <button class="add-note-circle-btn" id="btnAddNote" title="New Task">+</button>

        <!-- Bottom Task Manager & Edge Switcher Icons -->
        <div class="rail-settings-group">
          <button class="rail-icon-btn" id="btnOpenManager" title="Open Full Task Manager (Alt+Space)">⊞</button>
          <button class="rail-icon-btn" id="btnFlipEdge" title="Flip Screen Edge (Left ◧ / Right ◨)">◨</button>
        </div>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
